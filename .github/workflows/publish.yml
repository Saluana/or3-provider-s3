name: Publish npm package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: provider
      # Full provider tests exercise the host contract through the sibling checkout.
      # Set OR3_CHAT_CONTRACT_REF as a repository variable to a reviewed Chat
      # commit SHA. The default is the current coordinated Chat revision.
      - name: Validate OR3 Chat contract reference
        env:
          CONTRACT_REF: ${{ vars.OR3_CHAT_CONTRACT_REF || '88f5d236db1bbb3488705ebe2a42d94fcf62b8df' }}
        run: |
          if ! [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'OR3_CHAT_CONTRACT_REF must be a 40-character commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Saluana/or3-chat
          ref: ${{ vars.OR3_CHAT_CONTRACT_REF || '88f5d236db1bbb3488705ebe2a42d94fcf62b8df' }}
          path: or3-chat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prepare OR3 Chat host types
        working-directory: or3-chat
        run: bun install --frozen-lockfile
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - name: Verify release version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match package version v$version." >&2
              exit 1
            }
            output="$(npm view "$(node -p "require('./package.json').name")@$version" version 2>&1)" || status=$?
            if [[ "${status:-0}" -eq 0 ]]; then
              echo "$(node -p "require('./package.json').name")@$version already exists; choose a new version." >&2
              exit 1
            fi
            grep -Eq 'E404|404 Not Found|not found' <<<"$output" || { echo "$output" >&2; exit "${status}"; }
          fi
      - run: bun run type-check
      - run: bun run type-check:standalone
      - run: bun run test
      - name: Build pinned MinIO test fixture
        run: docker build --file .github/fixtures/minio.Dockerfile --tag or3-s3-ci-fixture .github/fixtures
      - name: Start disposable S3 compatibility server
        run: |
          set -euo pipefail
          docker run -d --name or3-s3-ci -p 127.0.0.1:19091:9000 \
            -e MINIO_ROOT_USER=or3-local-test \
            -e MINIO_ROOT_PASSWORD=or3-disposable-test-secret \
            or3-s3-ci-fixture server /data
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:19091/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs or3-s3-ci
          exit 1
      - name: Verify real S3 upload and download lifecycle
        env:
          OR3_S3_INTEGRATION_TESTS: "true"
          OR3_STORAGE_S3_ENDPOINT: http://127.0.0.1:19091
          OR3_STORAGE_S3_REGION: us-east-1
          OR3_STORAGE_S3_BUCKET: or3-parity-test
          OR3_STORAGE_S3_ACCESS_KEY_ID: or3-local-test
          OR3_STORAGE_S3_SECRET_ACCESS_KEY: or3-disposable-test-secret
          OR3_STORAGE_S3_FORCE_PATH_STYLE: "true"
          OR3_STORAGE_S3_KEY_PREFIX: parity/
        run: |
          set -euo pipefail
          bun -e 'import {S3Client, CreateBucketCommand} from "@aws-sdk/client-s3"; const client = new S3Client({endpoint: process.env.OR3_STORAGE_S3_ENDPOINT, region: process.env.OR3_STORAGE_S3_REGION, forcePathStyle: true, credentials: {accessKeyId: process.env.OR3_STORAGE_S3_ACCESS_KEY_ID, secretAccessKey: process.env.OR3_STORAGE_S3_SECRET_ACCESS_KEY}}); await client.send(new CreateBucketCommand({Bucket: process.env.OR3_STORAGE_S3_BUCKET})); client.destroy();'
          bun run test src/runtime/server/storage/__tests__/minio.integration.test.ts --reporter=dot --reporter=json --outputFile="$RUNNER_TEMP/s3-integration.json"
      - name: Save S3 compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-integration-evidence
          path: ${{ runner.temp }}/s3-integration.json
          if-no-files-found: warn
      - name: Remove disposable S3 server
        if: always()
        run: docker rm -f or3-s3-ci || true
      - run: bun run build
      - name: Validate package archive
        run: npm pack --dry-run --json > "$RUNNER_TEMP/package-pack.json"
      - name: Create publish archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/or3-npm-package"
          mkdir -p "$archive_dir"
          npm pack --pack-destination "$archive_dir" >/dev/null
          cp package.json "$archive_dir/package.json"
      - name: Upload publish archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/or3-npm-package
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download publish archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/or3-npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Publish immutable package
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/or3-npm-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          npm publish "$archive" --access public --provenance
      - name: Verify exact npm propagation
        run: |
          set -euo pipefail
          package_json="$RUNNER_TEMP/or3-npm-package/package.json"
          name="$(node -e 'console.log(require(process.argv[1]).name)' "$package_json")"
          version="$(node -e 'console.log(require(process.argv[1]).version)' "$package_json")"
          # npm accepts provenance-backed uploads before its read API serves them.
          # Prior releases exceeded 40s; always refresh cached registry responses.
          for attempt in {1..36}; do
            if [[ "$(npm view "$name@$version" version --prefer-online 2>/dev/null || true)" == "$version" ]]; then exit 0; fi
            sleep 5
          done
          echo "Timed out waiting for $name@$version to become visible on npm." >&2
          exit 1
